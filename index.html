<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1524">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ครูซอส">
<link rel="icon" type="image/png" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>สมุดภารกิจครูซอส</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<style>
/* Layout: แถบเมนูจัดกลุ่มด้านซ้าย (จอใหญ่) / แถบลอยด้านล่าง + แผ่นเมนู (จอเล็ก) · สีของวันตามปฏิทินราชการ: เขียว=วันเรียน แดง=อาทิตย์ ส้ม=วันหยุด ฟ้า=ชดเชย เทาเข้ม=นอกภาคเรียน */
:root{
  /* ธีม "โต๊ะทำงาน": เทาเหล็ก + กรมท่าเข้ม เส้นขอบชัด เงาทึบ สีหลักส้มเซฟตี้ น้ำเงิน เขียวทหาร (ฟอนต์เดียวทั้งระบบ) */
  --bg:#e8ecf1; --surface:#ffffff; --surface2:#f3f5f8; --line:#cbd3de; --line2:#e3e8ef; --edge:#16202c;
  --ink:#16202c; --muted:#56627a; --brand:#ff6b1a; --brand-ink:#16202c; --brand-soft:#ffe8da;
  --c-violet:#7480f2; --c-sky:#2d9cdb; --c-teal:#12a594; --c-mint:#1fa971; --c-amber:#ff6b1a; --c-coral:#ff6b1a; --c-pink:#8aa82a; --c-lime:#b8864b;
  --d-school:#1fa971; --d-sun:#e5484d; --d-hol:#f2a900; --d-make:#3b8cff; --d-off:#c3cbd8; --d-sat-bg:#dde3eb; --d-sat-ink:#5f6b80;
  --on-color:#16202c; --sheet:#fffef9; --rule:#dfe5ee; --glass:rgba(255,255,255,.97);
  --shadow:4px 4px 0 var(--edge);
  --f-body:'IBM Plex Sans Thai','Sarabun','Leelawadee UI','Thonburi',system-ui,sans-serif;
  --f-head:var(--f-body); --f-num:var(--f-body);
  color-scheme:light;
}
.num,.dpill b,.big,.bignum,.cd b,.daychip b{font-variant-numeric:tabular-nums}

*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{background:radial-gradient(1100px 560px at 8% -8%,rgba(255,77,141,.16),transparent 60%),radial-gradient(900px 520px at 108% 6%,rgba(34,211,238,.13),transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.6;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3{font-family:var(--f-head);text-wrap:balance;margin:0;line-height:1.3;font-weight:600}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
svg{flex:none}

/* ===== landing ===== */
.landing{min-height:100vh;display:grid;place-items:center;
  padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 0) 0 0/24px 24px,radial-gradient(900px 500px at 15% 0%,rgba(255,77,141,.22),transparent 60%),var(--bg)}
.lcard{width:min(100%,1060px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-radius:28px;overflow:hidden;background:var(--surface);box-shadow:0 10px 0 rgba(0,0,0,.3),0 30px 80px rgba(0,0,0,.45);border:2px solid var(--line)}
.lpanel{position:relative;overflow:hidden;color:#fff;padding:36px;display:flex;flex-direction:column;gap:16px;
  background:linear-gradient(150deg,#ff4d8d 0%,#8b3dff 52%,#22b8d8 100%)}
.lpanel::after{content:"";position:absolute;right:-90px;bottom:-90px;width:300px;height:300px;border-radius:50%;
  background:conic-gradient(from 30deg,#f5c542,#e8a317,#2dd4bf,#38bdf8,#f5c542);opacity:.3;filter:blur(4px)}
.lpanel>*{position:relative;z-index:1}
.lschool{display:flex;gap:12px;align-items:center}
.lschool .ico{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.16);display:grid;place-items:center}
.lschool b{display:block;font-family:var(--f-head);font-size:17px}
.lschool small{opacity:.85;font-size:13px}
.ybadge{align-self:flex-start;background:rgba(255,255,255,.18);border-radius:999px;padding:3px 14px;font-size:13px;font-weight:600}
.lpanel h1{font-size:clamp(26px,3.4vw,34px);line-height:1.25}
.lpanel p{margin:0;opacity:.9;font-size:15px}
.feat{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:10px 14px;font-size:14px}
.feat svg{width:18px;height:18px;margin-top:3px}
.lfoot{font-size:12px;opacity:.75;margin-top:auto}
.lright{padding:40px 36px;display:flex;flex-direction:column;justify-content:center;gap:18px}
.lright h2{font-size:30px;color:var(--ink)}
.lright .hello{color:var(--muted);margin:0}
.ltoday{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.lt{border-radius:16px;padding:12px;background:color-mix(in srgb,var(--k) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--k) 25%,transparent)}
.lt b{display:block;font-family:var(--f-num);font-size:24px;line-height:1.15;color:var(--k)}
.lt span{font-size:12.5px;color:var(--muted)}
.enter{display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:16px;padding:15px 20px;cursor:pointer;
  background:var(--brand);color:var(--brand-ink);font-family:var(--f-head);font-size:18px;font-weight:600;text-decoration:none;box-shadow:0 5px 0 #b8920f,0 12px 26px rgba(0,0,0,.35)}
.enter:hover{filter:brightness(1.07)}
.lpriv{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;justify-content:center}

/* ===== shell ===== */
.side{position:fixed;inset:0 auto 0 0;width:272px;z-index:12;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 12px calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px));overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px;border-bottom:1px solid var(--line2);margin-bottom:8px;text-decoration:none}
.brand .ico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#ff4d8d,#ffd23f);flex:none}
.brand b{display:block;font-family:var(--f-head);font-size:15px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ngroup{font-size:12px;font-weight:600;color:var(--muted);padding:14px 10px 4px;letter-spacing:.02em}
.nlink{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:12px;text-decoration:none;color:var(--ink);font-size:14.5px;font-weight:500}
.nlink .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--k);background:color-mix(in srgb,var(--k) 12%,transparent)}
.nlink .ic svg{width:17px;height:17px}
.nlink:hover{background:var(--surface2)}
.nlink[aria-current="page"]{background:var(--brand-soft);font-weight:600;box-shadow:inset 0 0 0 2px var(--line)}
.nlink[aria-current="page"] .ic{background:var(--k);color:var(--on-color);box-shadow:0 3px 0 rgba(0,0,0,.3)}
.side-foot{margin-top:auto;padding:14px 10px 4px;border-top:1px solid var(--line2);font-size:13px;color:var(--muted)}
.side-foot b{color:var(--ink);display:block}
.main{margin-left:272px;min-height:100vh}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
  padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px}
.topbar h1{font-size:19px;margin-right:auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.datechip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;background:var(--brand-soft);color:var(--ink);font-size:13.5px;font-weight:600;white-space:nowrap}
.datechip svg{width:15px;height:15px;color:var(--brand)}
.saving{font-size:12.5px;color:var(--muted);white-space:nowrap}
.content{padding-block:22px 72px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.wrap{max-width:1480px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.bnav{display:none}
@media (max-width:1023px){
  .side{display:none}
  .main{margin-left:0}
  .topbar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topbar .datechip .full{display:none}
  .content{padding-block:16px calc(env(safe-area-inset-bottom,0px) + 132px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .bnav{display:flex;position:fixed;z-index:15;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(600px,calc(100% - 24px));
    align-items:center;justify-content:space-around;gap:2px;padding:8px 10px;border-radius:28px;background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
    border:2px solid var(--line);box-shadow:0 6px 0 rgba(0,0,0,.3),0 18px 40px rgba(0,0,0,.45)}
  .bnav a,.bnav .bm{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px;border-radius:20px;text-decoration:none;color:var(--muted);font-size:12.5px;font-weight:500;border:0;background:none;cursor:pointer;font-family:var(--f-body)}
  .bnav svg{width:26px;height:26px}
  .bnav span{white-space:nowrap}
  .bnav a[aria-current="page"]{color:var(--k);background:color-mix(in srgb,var(--k) 16%,transparent);font-weight:600}
  .fab{flex:0 0 auto;width:66px;height:66px;border-radius:22px;border:4px solid var(--bg);margin:-30px 6px 0;cursor:pointer;display:grid;place-items:center;color:#fff;
    background:conic-gradient(from 200deg,#ff4d8d,#ffd23f,#4ade80,#22d3ee,#8b5cf6,#ff4d8d);box-shadow:0 6px 0 rgba(0,0,0,.35),0 0 24px rgba(255,77,141,.45)}
  .fab svg{width:30px;height:30px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
}
@media (max-width:380px){.bnav a,.bnav .bm{font-size:11.5px}.bnav svg{width:24px;height:24px}}

/* ===== shared ui ===== */
.card{background:var(--surface);border:2px solid var(--line);border-radius:22px;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.pad{padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:2px solid var(--line);background:var(--surface2);box-shadow:0 3px 0 rgba(0,0,0,.35);border-radius:12px;padding:7px 14px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink);min-height:40px}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);box-shadow:0 4px 0 #b8920f;font-weight:600}
.btn.primary:hover{filter:brightness(1.08);color:var(--brand-ink)}
.btn.color{background:var(--k);border-color:var(--k);color:var(--on-color);font-weight:600;box-shadow:0 4px 0 color-mix(in srgb,var(--k) 55%,#000)}
.btn.color:hover{filter:brightness(1.06);color:var(--on-color)}
.btn.quiet{border-color:transparent;background:none;color:var(--muted);padding:6px 8px;box-shadow:none}
.btn.quiet:hover{color:var(--brand)}
.btn.danger{color:var(--d-sun);border-color:color-mix(in srgb,var(--d-sun) 40%,var(--line))}
.btn.armed{background:var(--d-sun);border-color:var(--d-sun);color:#fff}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13.5px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:17px;height:17px}
.ibtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;cursor:pointer;color:var(--ink)}
.ibtn svg{width:16px;height:16px}
.ibtn.del{background:var(--d-sun);border-color:var(--d-sun);color:#fff}
.ibtn.armed{outline:3px solid color-mix(in srgb,var(--d-sun) 40%,transparent)}
.hint{color:var(--muted);font-size:14px;margin:0}
.empty{border:1.5px dashed var(--line);border-radius:18px;padding:26px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.badge{display:inline-flex;align-items:center;font-size:12.5px;font-weight:600;border-radius:999px;padding:2px 10px;background:color-mix(in srgb,var(--k) 15%,transparent);color:color-mix(in srgb,var(--k) 75%,var(--ink));white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-size:13px;font-weight:500;background:color-mix(in srgb,var(--k) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--k) 28%,transparent);white-space:nowrap}
.tag::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--k)}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}
.vhead h2{font-size:clamp(20px,2.4vw,24px);display:flex;align-items:center;gap:8px}
.vhead h2 svg{width:22px;height:22px;color:var(--brand)}
.vhead p{margin:2px 0 0;color:var(--muted);font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:5px;border-radius:16px;background:var(--brand-soft)}
.tabs a{display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 10px;border-radius:12px;text-decoration:none;font-size:14px;font-weight:500;color:var(--muted);text-align:center}
.tabs a svg{width:17px;height:17px}
.tabs a[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
@media (max-width:760px){.tabs a{font-size:13px;padding:8px 4px;gap:5px}}
.strip{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 18px;border-radius:16px;background:var(--brand-soft);font-weight:600}
.strip b{font-family:var(--f-num)}
.field{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea,.inp{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;color:var(--ink);font-size:15.5px;min-width:0;width:100%}
.req{color:var(--d-sun)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 13px;cursor:pointer;font-size:14px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip.has{color:var(--ink);font-weight:500}
.chip .ct{font-family:var(--f-num);font-size:12px;background:var(--surface2);border-radius:999px;padding:0 6px}
.chip[aria-pressed="true"]{background:var(--k,var(--brand));border-color:var(--k,var(--brand));color:var(--on-color);font-weight:600}
.chip[aria-pressed="true"] .ct{background:rgba(255,255,255,.25)}

/* tables */
.tbl-wrap{overflow-x:auto;border-radius:16px;border:1px solid var(--line2);container-type:inline-size}
@container (max-width:640px){
  table.t{min-width:0!important}
  table.t thead{display:none}
  table.t tr{display:block;border-top:1px solid var(--line2);padding:10px 12px}
  table.t tbody tr:first-child{border-top:0}
  table.t td{display:flex;gap:10px;border:0;padding:3px 0;align-items:baseline}
  table.t td::before{content:attr(data-label);flex:0 0 82px;color:var(--muted);font-size:12.5px;font-weight:500}
  table.t td.nowrap{white-space:normal}
  table.t td.act{justify-content:flex-end;padding-top:6px}
  table.t td.act::before,table.t td.full::before{content:none}
  table.t td.full{justify-content:center}
}
table.t{width:100%;border-collapse:collapse;font-size:14.5px}
table.t th{background:var(--brand-soft);text-align:left;font-weight:600;padding:11px 14px;white-space:nowrap}
table.t td{padding:10px 14px;border-top:1px solid var(--line2);vertical-align:middle}
table.t td.nowrap{white-space:nowrap;font-weight:600}
table.t td.act{text-align:right;white-space:nowrap}
table.t td.act .ibtn+.ibtn{margin-left:6px}
table.t small{color:var(--muted)}
.filterbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.filterbar .inp{width:auto;flex:1 1 220px;max-width:340px}
.filterbar select.inp{flex:0 1 220px}
.filterbar .sp{flex:1}

/* ===== day colors ===== */
.mini{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.mini .wd{text-align:center;font-size:12.5px;color:var(--muted);font-weight:500;padding-bottom:2px}
.dc{aspect-ratio:1/0.82;border-radius:10px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);display:grid;place-items:center;font-family:var(--f-num);font-size:14px;font-weight:600;border:0;cursor:pointer;padding:0;color:#fff;position:relative;max-width:100%}
.dc.blank{background:none;cursor:default}
.dc.school{background:var(--d-school)}
.dc.sun{background:var(--d-sun)}
.dc.sat{background:var(--d-sat-bg);color:var(--d-sat-ink)}
.dc.sat .mk,.dc.sat.mt::after{background:var(--c-violet)}
.dc.holiday{background:var(--d-hol)}
.dc.makeup{background:var(--d-make)}
.dc.off{background:var(--d-off)}
.dc.today{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.dc .mk{position:absolute;left:50%;transform:translateX(-50%);bottom:4px;width:5px;height:5px;border-radius:50%;background:#fff;opacity:.9}
.dc.mt::after{background:var(--brand);bottom:3px;width:18px;height:4px;box-shadow:0 0 6px var(--brand)}
.dc.mt .mk{display:none}
.dc:hover{filter:brightness(1.08)}
.mtitle{text-align:center;font-family:var(--f-head);font-weight:600;font-size:16px;margin-bottom:10px}
.mtitle span{color:var(--muted);font-weight:500;font-size:14px}

/* semester view */
.semrow{display:grid;grid-template-columns:minmax(280px,360px) minmax(0,1fr);gap:16px;align-items:stretch}
.semrow>.card,.semrow>.side-stack{display:flex;flex-direction:column}
.semrow>.card:first-child{align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px)}
@media (max-width:900px){.semrow>.card:first-child{position:static}}
.semrow .holcard .ilist{flex:1}
.mstat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding-top:14px}
.mstat div{background:var(--surface2);border:1px solid var(--line);border-left:3px solid var(--k);border-radius:3px;padding:8px 10px;min-width:0}
.mstat div{padding:6px 8px}
.mstat b{display:block;font-size:18px;font-style:italic;color:var(--k);line-height:1.1}
.mstat span{font-size:12px;color:var(--muted)}
.mempty{flex:1;display:grid;place-items:center;text-align:center;border:1px dashed var(--line);border-radius:4px;padding:18px;color:var(--muted);font-size:14px}
@media (max-width:520px){.mstat{grid-template-columns:repeat(2,minmax(0,1fr))}}
.semrow .card{padding:16px}
.holcard h3{font-size:16px;display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.side-stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.mtl{display:flex;flex-direction:column;gap:8px}
.ditem .go{display:inline-flex;align-items:center;gap:2px;font-size:13px;font-weight:600;color:var(--c-violet);white-space:nowrap;align-self:center}
.ditem .go svg{width:15px;height:15px}
.holcard h3 svg{width:18px;height:18px;color:var(--brand)}
@media (max-width:900px){.semrow{grid-template-columns:minmax(0,1fr)}}

/* calendar page */
.seg{display:flex;gap:6px;padding:6px;border-radius:20px;background:var(--surface);border:2px solid var(--line);flex-wrap:wrap}
.seg button{flex:1 1 140px;border:0;border-radius:14px;padding:10px 12px;font:inherit;font-weight:600;color:var(--muted);background:none;cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--c-coral);color:var(--on-color);box-shadow:0 4px 0 color-mix(in srgb,var(--c-coral) 55%,#000)}
.ilist{display:flex;flex-direction:column;gap:8px}
.irow2{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:8px 10px 8px 8px;border-radius:16px;border:2px solid color-mix(in srgb,var(--k) 35%,transparent);background:color-mix(in srgb,var(--k) 9%,var(--surface));color:var(--ink);text-decoration:none;cursor:pointer;font:inherit}
.irow2:hover{border-color:var(--k)}
.irow2 .dpill{width:46px;flex:none;padding:5px 0}
.irow2 .tt{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.irow2 .sub{display:block}
.cnt{font-family:var(--f-num);font-size:12px;font-weight:600;background:var(--surface2);border-radius:999px;padding:1px 9px;color:var(--muted)}
.meetwrap{display:grid;grid-template-columns:minmax(300px,400px) minmax(0,1fr);gap:16px;align-items:start}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;text-align:center}
@media (max-width:900px){.meetwrap{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.irow2 .badge{display:none}}

/* year grid — พอดีความกว้าง ไม่ต้องเลื่อน */
.ywrap{container-type:inline-size;border-radius:16px;border:1px solid var(--line2);overflow:hidden;background:var(--surface)}
.ytbl{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed;font-size:12px}
.ytbl th,.ytbl td{text-align:center;padding:0;height:32px;border-top:1px solid var(--line2);overflow:hidden}
.ytbl thead th{background:var(--brand-soft);font-weight:600;font-size:11.5px;border-top:0}
.ytbl col.c-mn{width:11%}.ytbl col.c-tot{width:5.5%}
.ytbl .mn{text-align:left;padding:0 8px;font-weight:600;white-space:nowrap;text-overflow:ellipsis;border-right:1px solid var(--line2)}
.ytbl .mn .s{display:none}
.ytbl .tot{font-family:var(--f-num);font-weight:600;border-left:1px solid var(--line2);font-size:12px}
.yc{display:block;width:100%;height:100%;border:0;background:none;cursor:pointer;font-family:var(--f-body);font-weight:600;font-size:11.5px;padding:0;letter-spacing:-.02em;position:relative}
.yc.school{background:color-mix(in srgb,var(--d-school) 13%,var(--surface));color:color-mix(in srgb,var(--d-school) 80%,var(--ink))}
.yc.makeup{background:color-mix(in srgb,var(--d-make) 18%,var(--surface));color:color-mix(in srgb,var(--d-make) 85%,var(--ink))}
.yc.sun{background:color-mix(in srgb,var(--d-sun) 12%,var(--surface));color:var(--d-sun);font-weight:500}
.yc.sat{background:var(--surface2);color:var(--d-sat-ink);font-weight:500}
.yc.holiday{background:color-mix(in srgb,var(--d-hol) 18%,var(--surface));color:color-mix(in srgb,var(--d-hol) 85%,var(--ink))}
.yc.off{background:color-mix(in srgb,var(--d-off) 10%,var(--surface));color:color-mix(in srgb,var(--d-off) 60%,var(--muted));font-size:8px}
.yc.today{box-shadow:inset 0 0 0 2px var(--ink)}
.yc.mt::after,.dc.mt::after,table.pc button.mt::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:3px;width:14px;height:3px;border-radius:2px;background:var(--c-violet)}
.ytbl tfoot td{background:var(--brand-soft);font-weight:600;height:38px;border-top:1px solid var(--line)}
.ytbl tfoot .lbl{text-align:right;padding-right:12px}
.ytbl td.na{background:var(--surface)}
@container (max-width:900px){
  .ytbl,.ytbl tbody,.ytbl tfoot{display:block}
  .ytbl thead,.ytbl colgroup{display:none}
  .ytbl tr{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:3px;padding:10px;border-top:1px solid var(--line2)}
  .ytbl tbody tr:first-child{border-top:0}
  .ytbl td{border:0;height:38px;border-radius:7px}
  .ytbl td.na{display:none}
  .ytbl .mn{grid-column:1/-1;border:0;height:auto;padding:0 2px 2px;font-size:14px;display:flex;justify-content:space-between}
  .ytbl .mn .s{display:inline;color:var(--muted);font-weight:500;font-family:var(--f-num)}
  .ytbl td.tot{display:none}
  .ytbl tfoot td.tot{display:block}
  .yc{border-radius:7px;font-size:12.5px}
  .yc::before{content:attr(data-d);position:absolute;left:3px;top:1px;font-size:8.5px;font-weight:500;opacity:.6}
  .ytbl tfoot tr{display:flex;justify-content:space-between;background:var(--brand-soft)}
  .ytbl tfoot td{background:none;height:auto;border:0}
  .ytbl tfoot td:first-child{display:none}
}

.pcal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
.pgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line2);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.pwd{background:var(--surface2);text-align:center;font-size:12.5px;font-weight:600;color:var(--muted);padding:7px 0}
.pwd.sun{color:var(--d-sun)}
.pday{background:var(--surface);min-height:118px;padding:6px;border:0;text-align:left;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0;color:var(--ink);font:inherit}
.pday:hover{background:var(--surface2)}
.pday.blank{background:var(--surface2);cursor:default}
.pday .n{display:flex;justify-content:space-between;align-items:center;gap:4px}
.pday .n b{font-family:var(--f-num);font-weight:600;font-size:14px;min-width:26px;height:26px;display:grid;place-items:center;border-radius:9px}
.pday .n i{font-style:normal;font-family:var(--f-num);font-size:10px;font-weight:600;color:color-mix(in srgb,var(--d-school) 80%,var(--ink));background:color-mix(in srgb,var(--d-school) 13%,transparent);border-radius:6px;padding:0 5px;white-space:nowrap}
.pday.makeup .n i{color:color-mix(in srgb,var(--d-make) 85%,var(--ink));background:color-mix(in srgb,var(--d-make) 15%,transparent)}
.pday.sun .n b{color:var(--d-sun)}
.pday.sat .n b,.pday.off .n b{color:var(--muted)}
.pday.holiday{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--d-hol) 10%,var(--surface)) 0 6px,var(--surface) 6px 12px)}
.pday.holiday .n b{color:var(--d-hol)}
.pday.today .n b{background:var(--brand);color:var(--brand-ink)}
.ev{font-size:11.5px;line-height:1.4;border-radius:6px;padding:1px 6px;background:color-mix(in srgb,var(--k) 14%,var(--surface));border-left:3px solid var(--k);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.ev.hol{background:none;border-left:0;padding-left:0;color:color-mix(in srgb,var(--k) 85%,var(--ink));font-weight:600}
.evs{display:flex;flex-direction:column;gap:2px;min-width:0}
.more{font-size:11px;color:var(--muted);padding-left:4px}
.agl{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:20px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);max-height:calc(100vh - 110px);overflow:auto}
.agl h3{font-size:16px}
.agd{display:grid;grid-template-columns:50px minmax(0,1fr);gap:10px;align-items:start}
.agd .items{display:flex;flex-direction:column;gap:6px;min-width:0}
.agi{display:block;text-align:left;border:1px solid color-mix(in srgb,var(--k) 25%,transparent);background:color-mix(in srgb,var(--k) 9%,var(--surface));border-radius:12px;padding:7px 10px;cursor:pointer;color:var(--ink);text-decoration:none;font:inherit;width:100%}
.agi b{display:block;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agi small{color:var(--muted);font-size:12.5px}
@media (max-width:1180px){.pcal-wrap{grid-template-columns:minmax(0,1fr)}.agl{position:static;max-height:none}}
@media (max-width:640px){
  .pday{min-height:62px;padding:4px;align-items:center}
  .pday .n{flex-direction:column;gap:1px}
  .pday .n i{font-size:8.5px;padding:0 3px}
  .evs{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:3px}
  .ev{width:7px;height:7px;padding:0;border:0;border-radius:50%;background:var(--k);font-size:0}
  .ev.hol{display:none}
  .more{display:none}
}

/* plan (4 ฝ่าย) */
.pmonth{display:grid;grid-template-columns:minmax(300px,360px) minmax(0,1fr);border:1.5px solid var(--line);border-radius:20px;overflow:hidden;background:var(--surface)}
.pcal{border-right:1.5px solid var(--line);display:flex;flex-direction:column}
.pcal-h{text-align:center;font-family:var(--f-head);font-weight:600;padding:10px;background:var(--brand-soft)}
table.pc{border-collapse:collapse;width:100%;font-size:13px;text-align:center}
table.pc th{font-weight:600;color:var(--muted);padding:5px 0;font-size:12px;border-bottom:1px solid var(--line2)}
table.pc td{padding:0;height:32px;border-bottom:1px solid var(--line2);border-right:1px solid var(--line2)}
table.pc td:last-child{border-right:0;background:var(--surface2);font-family:var(--f-num);font-weight:600;color:var(--muted)}
table.pc button{position:relative;width:100%;height:100%;border:0;background:none;cursor:pointer;font-family:var(--f-num);font-weight:600;color:var(--ink);font-size:13px;padding:0}
table.pc button.sun{color:var(--d-sun)}
table.pc button.sat{color:var(--d-sat-ink);font-weight:500}
table.pc button.holiday{background:color-mix(in srgb,var(--d-hol) 22%,var(--surface))}
table.pc button.makeup{background:color-mix(in srgb,var(--d-make) 20%,var(--surface))}
table.pc button.off{color:var(--muted);opacity:.5}
table.pc button.today{outline:2px solid var(--ink);outline-offset:-2px}
.ptot{display:grid;grid-template-columns:1fr auto;font-size:13.5px;font-weight:600}
.ptot span{padding:7px 12px;border-bottom:1px solid var(--line2);text-align:right}
.ptot span:nth-child(even){font-family:var(--f-num);min-width:72px;text-align:center;border-left:1px solid var(--line2)}
.ptot .alt{background:var(--brand-soft)}
.pnote{padding:8px 12px;font-size:12.5px;color:var(--d-sun);background:color-mix(in srgb,var(--d-sun) 6%,var(--surface));font-weight:500}
.pcols{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.pcol{border-right:1px solid var(--line2);display:flex;flex-direction:column;min-width:0}
.pcol:last-child{border-right:0}
.pcol-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px 6px;padding:9px 6px;font-weight:600;font-size:13.5px;background:color-mix(in srgb,var(--k) 10%,var(--surface));border-bottom:2px solid var(--k);text-align:center}
.pcol-h button{border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:11.5px;padding:0 8px;cursor:pointer;color:var(--ink)}
.pcol-b{padding:8px;display:flex;flex-direction:column;gap:6px;min-height:80px}
.pitem{display:flex;gap:4px;align-items:flex-start;padding:7px 8px;border-radius:10px;background:var(--surface2);font-size:13px;line-height:1.45;border:1px solid var(--line2);text-align:left;width:100%;cursor:pointer;color:var(--ink)}
.pitem:hover{border-color:var(--k)}
.pitem b{font-weight:600;color:color-mix(in srgb,var(--k) 70%,var(--ink))}
.pitem.ag{background:color-mix(in srgb,var(--c-violet) 8%,var(--surface));border-color:color-mix(in srgb,var(--c-violet) 25%,transparent)}
.pnone{color:var(--muted);font-size:12.5px;text-align:center;padding:10px 0}
@media (max-width:1280px){.pcols{grid-template-columns:repeat(3,minmax(0,1fr))}.pcol{border-bottom:1px solid var(--line2)}}
@media (max-width:900px){.pmonth{grid-template-columns:minmax(0,1fr)}.pcal{border-right:0;border-bottom:1.5px solid var(--line)}.pcols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.pcols{grid-template-columns:minmax(0,1fr)}.pcol{border-right:0}}

/* ===== home ===== */
.bento{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.tile{border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:10px;min-width:0;position:relative;overflow:hidden}
.t-day{background:linear-gradient(140deg,#22c55e,#06b6d4);color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.28)}
.t-day.offday{background:linear-gradient(140deg,#5b4fb0,#3a2f8a)}
.t-day.holday{background:linear-gradient(140deg,#ff9f1c,#ff4d8d)}
.t-next{grid-column:span 2;background:var(--brand);color:var(--brand-ink);box-shadow:0 6px 0 #b8920f;min-height:220px}
.t-next::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:conic-gradient(from 90deg,#ff4d8d,#ff9f43,#22d3ee,#ff4d8d);opacity:.55}
.t-next>*,.t-day>*{position:relative;z-index:1}
.t-label{font-size:13px;font-weight:600;letter-spacing:.03em;opacity:.92}
.bignum{font-family:var(--f-num);font-size:54px;line-height:1;font-weight:600}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:99px}
.t-next h3{font-size:21px}
.meta2{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;opacity:.92}
.t-next .btn,.t-day .btn{align-self:flex-start;background:#fff;border-color:#fff;color:#0f1b33;margin-top:auto}
.t-soft{background:color-mix(in srgb,var(--k) 12%,var(--surface));border:2px solid color-mix(in srgb,var(--k) 45%,transparent);box-shadow:0 6px 0 rgba(0,0,0,.25)}
.t-up{grid-column:span 2;background:var(--surface);border:2px solid var(--line);box-shadow:0 6px 0 rgba(0,0,0,.25)}
.irow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 6px;border-top:1px solid var(--line2);text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;cursor:pointer;color:var(--ink)}
.irow:first-child{border-top:0}
.irow:hover{background:var(--surface2);border-radius:12px}
.dpill{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:13px;padding:4px 0;background:color-mix(in srgb,var(--k) 14%,var(--surface));color:color-mix(in srgb,var(--k) 80%,var(--ink));line-height:1.1}
.dpill b{font-family:var(--f-num);font-size:19px}
.dpill span{font-size:11px;font-weight:600}
.tt{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-list{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none;font-size:14px}
.mini-list li{display:flex;gap:8px;align-items:baseline;min-width:0}
.mini-list li span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.big{font-family:var(--f-num);font-size:38px;line-height:1;font-weight:600;color:var(--k)}
@media (max-width:1100px){.bento{grid-template-columns:repeat(2,minmax(0,1fr))}.t-next,.t-up{grid-column:1/-1}.t-soft{order:1}.t-next{order:2}.t-up{order:3}}
@media (max-width:600px){.t-year{padding:14px}.bento{grid-template-columns:minmax(0,1fr)}.irow{grid-template-columns:48px minmax(0,1fr)}.irow .badge{display:none}}

/* ===== meetings ===== */
.mlist{display:flex;flex-direction:column;gap:10px}
.mcard{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:16px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 16px 12px 12px;text-decoration:none;color:var(--ink)}
.mcard:hover{border-color:var(--c-violet)}
.mcard .dpill{padding:8px 0}
.mcard h3{font-size:17px;font-family:var(--f-body);font-weight:600}
.facts{display:flex;gap:4px 12px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.paper{background:var(--surface);border:2px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.mhead{padding:20px 22px 16px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(120deg,color-mix(in srgb,var(--c-violet) 12%,var(--surface)),color-mix(in srgb,var(--c-sky) 8%,var(--surface)))}
.eyebrow{color:var(--c-violet);font-weight:600;font-size:14px;margin:0}
.title-in{font-family:var(--f-head);font-size:24px;font-weight:600;border:0;border-bottom:1.5px solid transparent;background:none;width:100%;padding:2px 0}
.title-in:hover{border-bottom-color:var(--line)}
.title-in:focus{outline:none;border-bottom-color:var(--c-violet)}
.meta{display:flex;gap:10px 18px;flex-wrap:wrap}
.meta label{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.meta input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:4px 8px;min-width:0}
.meta input.place{width:min(240px,58vw)}
.blk{padding:18px 22px;border-top:1px solid var(--line2)}
.blk-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.blk-h h3{font-size:18px}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px}
.file{border:1px solid var(--line);border-radius:14px;background:var(--surface2);overflow:hidden;cursor:pointer;padding:0;text-align:left;display:flex;flex-direction:column;color:var(--ink)}
.file:hover{border-color:var(--c-sky)}
.thumb{aspect-ratio:4/3;width:100%;max-width:100%;background:var(--line2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.pdf-tag{font-weight:700;color:var(--c-coral);border:2px solid var(--c-coral);border-radius:6px;padding:2px 8px;font-size:14px;letter-spacing:.08em}
.fname{font-size:13px;padding:6px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agenda{padding:14px 16px;border-radius:18px;border:1px solid var(--line2);background:var(--surface);display:flex;flex-direction:column;gap:8px}
.agenda+.agenda{margin-top:12px}
.agenda.mine{background:color-mix(in srgb,var(--c-amber) 9%,var(--surface));border-color:color-mix(in srgb,var(--c-amber) 40%,transparent)}
.ag-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ag-num{color:var(--c-pink);font-weight:600;font-size:14px;margin-right:auto}
.ag-dept{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:13px;max-width:100%}
.minebtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.minebtn svg{width:15px;height:15px}
.minebtn[aria-pressed="true"]{background:var(--c-amber);border-color:var(--c-amber);color:var(--on-color);font-weight:600}
.ag-title{font-size:17px;font-weight:600;border:0;border-bottom:1px solid var(--line2);background:none;padding:2px 0;width:100%}
.ag-title:focus{outline:none;border-bottom-color:var(--c-violet)}
.ag-sum{width:100%;min-height:112px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:0 12px;line-height:28px;background-color:var(--surface);
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 27px,var(--rule) 27px,var(--rule) 28px);background-attachment:local;background-position:0 -1px}
.ag-sum:focus{outline:none;border-color:var(--c-violet)}

/* ================= theme overrides: outlined toy style ================= */
body{background:radial-gradient(circle at 1px 1px,#b9c4d4 1.2px,transparent 0) 0 0/22px 22px,var(--bg);background-attachment:fixed}
.card,.paper,.t-up,.t-soft,.t-next,.t-day,.t-year,.seg,.mcard,.irow2,.agenda,.ditem,.file,.dlg,.empty,.strip,.tabs,.ywrap,.tbl-wrap{border:2.5px solid var(--edge)!important;box-shadow:4px 4px 0 var(--edge)!important}

.tbl-wrap{box-shadow:none!important;border-width:2px!important}
.empty{border-style:dashed!important;box-shadow:none!important}
.btn{border:2px solid var(--edge);background:var(--surface);box-shadow:3px 3px 0 var(--edge);color:var(--ink);font-weight:600}

.btn.primary{background:var(--brand);border-color:var(--edge);color:var(--brand-ink);box-shadow:3px 3px 0 var(--edge)}

.btn.armed{background:var(--d-sun);color:#fff}
.ibtn{border:2px solid var(--edge);box-shadow:2px 2px 0 var(--edge)}

.chip{border:2px solid var(--edge);color:var(--ink)}

.dpill{background:var(--k);color:var(--ink);border:2px solid var(--edge)}

.brand .ico{background:var(--brand);color:var(--ink);border:2.5px solid var(--edge);box-shadow:3px 3px 0 var(--edge)}

.dc{color:var(--ink);font-weight:700;border:2px solid var(--edge);box-shadow:none}

table.t th{background:var(--brand-soft)}

/* sharper corners */

.lp-foot b{color:var(--ink)}
@media (max-width:820px){
  .lp-main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;align-items:stretch;gap:12px}
  .lp-art{order:-1}
  .lp-frame{height:100%;max-height:min(40vh,420px);border-radius:26px;box-shadow:6px 6px 0 var(--edge)}
  .lp-copy{align-items:center;text-align:center}
  .lp-copy p{display:none}
  .lp-kick,.lp-enter{align-self:center}
  .lp-stats{width:100%}
  .lp-top .lp-chip{display:none}
}
@media (max-height:560px){.lp-art{display:none}.lp-main{grid-template-columns:minmax(0,1fr)}.lp-copy p{display:none}}

/* ===== unified Day 1–200 grid (same everywhere, keeps numbers when narrow) ===== */
.ygw{container-type:inline-size;width:100%}
.yg{display:grid;gap:2px;align-items:stretch}
.yg-w{grid-template-columns:clamp(40px,7cqw,74px) repeat(31,minmax(0,1fr)) clamp(26px,4cqw,44px)}
.yg-n{grid-template-columns:repeat(16,minmax(0,1fr));gap:3px}
.yg-h{font-size:clamp(9px,1cqw,12px);font-weight:600;color:var(--muted);text-align:center;align-self:end;padding-bottom:2px}
.yg-m{font-size:clamp(10.5px,1.15cqw,13.5px);font-weight:700;white-space:nowrap;align-self:center;overflow:hidden;text-overflow:ellipsis}
.yg-t{font-size:clamp(10.5px,1.15cqw,13.5px);font-weight:700;text-align:right;align-self:center;font-variant-numeric:tabular-nums}
.yg-n .yg-m{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;font-size:13.5px;margin-top:8px;padding-bottom:1px;border-bottom:2px solid var(--line2)}
.yg-n .yg-mt{font-size:12.5px;background:var(--d-school);border:1.5px solid var(--edge);border-radius:7px;padding:0 7px}
.yg-sep{grid-column:1/-1;height:4px}
.yg-c{display:grid;place-items:center;height:clamp(20px,2.5cqw,32px);border:1.5px solid var(--edge);border-radius:5px;padding:0;cursor:pointer;color:var(--ink);font:inherit;font-weight:700;font-size:clamp(8px,1.02cqw,12.5px);letter-spacing:-.03em;font-variant-numeric:tabular-nums;min-width:0;overflow:hidden;line-height:1;position:relative}
.yg-n .yg-c{height:auto;aspect-ratio:1/1;font-size:clamp(9px,2.9cqw,13px);border-radius:4px}
.yg-n .yg-h{font-size:clamp(9px,2.6cqw,12px)}
.yg-c.na{border:0;background:none;cursor:default}
.yg-c.school{background:var(--d-school)}
.yg-c.makeup{background:var(--d-make)}
.yg-c.holiday{background:var(--d-hol)}
.yg-c.sun{background:color-mix(in srgb,var(--d-sun) 75%,#fff)}
.yg-c.sat{background:var(--d-sat-bg);color:var(--d-sat-ink);font-weight:600}
.yg-c.off{background:var(--d-off);border-color:#8f9bb0;color:#6b7690}
.yg-c.today{outline:3px solid var(--brand);outline-offset:1px;z-index:1}
.yg-c.mt::after{content:"";position:absolute;left:15%;right:15%;bottom:1.5px;height:3px;border-radius:2px;background:var(--edge)}
.yg-foot{display:flex;justify-content:flex-end;gap:10px;align-items:center;margin-top:10px;font-weight:600}
.yg-foot b{font-size:18px;background:var(--brand);border:2px solid var(--edge);border-radius:10px;padding:1px 10px}
@container (max-width:540px){.yg-w{display:none}}
@container (min-width:540.01px){.yg-n{display:none}}

/* ===== legend ===== */
.lgd{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:10px 14px;border:2px solid var(--edge);border-radius:14px;background:var(--surface)}
.lgd-t{font-weight:700;font-size:13px;padding-right:12px;border-right:2px solid var(--line2)}
.lgd-i{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:500;white-space:nowrap}
.lgd-i .yg-c{width:26px;height:22px;font-size:10.5px;cursor:default}
@media (max-width:600px){.lgd{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}.lgd-t{grid-column:1/-1;border:0;padding:0}.lgd-i{white-space:normal}}

/* ===== bottom bar: add button inline ===== */
.bnav .bfab{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 2px;border:0;background:none;cursor:pointer;font:inherit;font-size:12.5px;font-weight:700;color:var(--ink)}
.bnav .bfab .pl{width:52px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--brand);border:2px solid var(--edge);box-shadow:2px 2px 0 var(--edge)}
.bnav .bfab .pl svg{width:22px;height:22px}
.bnav .bfab:active .pl{transform:translate(2px,2px);box-shadow:none}
.yg-c.d3{letter-spacing:-.07em}
.yg-w .yg-c.d3{font-size:clamp(7.5px,.92cqw,12px)}
.yg-n .yg-c.d3{font-size:clamp(8px,2.4cqw,11.5px);border-width:1px}

/* ================= THEME: Sport / esports (final layer) ================= */
:root{
  --bg:#0b1524; --surface:#13223a; --surface2:#1a2c48; --line:#2a3f5f; --line2:#1f3250; --edge:#2a3f5f;
  --ink:#eef4ff; --muted:#8ea3c0; --brand:#c6f432; --brand-ink:#0b1524; --brand-soft:#1a2c48;
  --c-violet:#7c8cff; --c-sky:#2fb4ff; --c-teal:#19d3b4; --c-mint:#21c46b; --c-amber:#ff7a1a; --c-coral:#ff7a1a; --c-pink:#c6f432; --c-lime:#ffb020;
  --d-school:#21c46b; --d-sun:#ff4d5e; --d-hol:#ffb020; --d-make:#2f9bff; --d-off:#2a3b55; --d-sat-bg:#1c2d47; --d-sat-ink:#7f93b2;
  --on-color:#0b1524; --rule:#23375a; --glass:rgba(11,21,36,.96); --accent2:#ff7a1a;
  --cut:14px; color-scheme:dark;
}
body{background:repeating-linear-gradient(135deg,rgba(198,244,50,.025) 0 2px,transparent 2px 22px),radial-gradient(1000px 520px at 85% -10%,rgba(47,180,255,.12),transparent 60%),radial-gradient(800px 480px at -5% 105%,rgba(255,122,26,.10),transparent 60%),var(--bg)!important;background-attachment:fixed!important;color:var(--ink)}
h1,h2,h3,.tb-txt h1,.mtitle,.mband h3,.lp-copy h1,.vhead h2{font-style:italic;font-weight:700;letter-spacing:.01em}
.card,.paper,.t-up,.t-soft,.t-next,.t-day,.t-year,.seg,.mcard,.irow2,.agenda,.ditem,.file,.dlg,.empty,.strip,.tabs,.ywrap,.tbl-wrap,.appfoot,.lgd{border:1px solid var(--line)!important;box-shadow:none!important;border-radius:4px!important}
.card,.paper,.t-up,.t-soft,.t-next,.t-day,.t-year,.appfoot,.dlg{clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}
.card,.paper,.t-up,.t-year,.dlg,.appfoot,.lgd,.seg,.tbl-wrap{background:var(--surface)!important}
.empty{border-style:dashed!important;background:transparent}
.irow2,.ditem,.agenda,.mcard{background:color-mix(in srgb,var(--k,var(--line)) 10%,var(--surface))!important;border-left:4px solid var(--k,var(--line))!important}
.irow2:hover,.ditem:hover,.mcard:hover{border-color:var(--k,var(--brand))!important}
.agenda{--k:var(--line)}.agenda.mine{--k:var(--c-amber)}
.mcard{--k:var(--c-violet)}
/* buttons: skewed */
.btn{border:1px solid var(--line);background:var(--surface2);color:var(--ink);box-shadow:none;border-radius:3px;transform:skewX(-10deg);font-weight:600}
.btn:hover{transform:skewX(-10deg) translateY(-1px);box-shadow:0 0 0 1px var(--brand);border-color:var(--brand);color:var(--ink)}
.btn:active{transform:skewX(-10deg) translateY(1px);box-shadow:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);box-shadow:none}
.btn.primary:hover{background:#d6ff4a;color:var(--brand-ink)}
.btn.color{background:var(--k);border-color:var(--k);color:var(--on-color);box-shadow:none}
.btn.quiet{transform:none;background:none;border-color:transparent}
.btn.quiet:hover{transform:none;box-shadow:none;color:var(--brand);text-decoration:none}
.btn.danger{color:var(--d-sun);border-color:color-mix(in srgb,var(--d-sun) 50%,var(--line))}
.btn.armed{background:var(--d-sun);color:#fff}
.ibtn{border:1px solid var(--line);background:var(--surface2);color:var(--ink);box-shadow:none;border-radius:3px}
.ibtn.del{background:var(--d-sun);border-color:var(--d-sun);color:#fff}
.chip{border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:3px;transform:skewX(-10deg)}
.chip[aria-pressed="true"]{background:var(--k,var(--brand));border-color:var(--k,var(--brand));color:var(--on-color);box-shadow:none}
.badge{background:color-mix(in srgb,var(--k) 22%,transparent);color:var(--ink);border:1px solid color-mix(in srgb,var(--k) 70%,transparent);border-radius:2px;transform:skewX(-10deg)}
.tag{border:1px solid var(--line);background:var(--surface2);color:var(--ink)}
.dpill{background:color-mix(in srgb,var(--k) 22%,var(--surface));color:var(--ink);border:1px solid var(--k);border-radius:3px}
.dpill b{color:var(--k)}
.seg{padding:5px!important}
.seg button{border-radius:2px;transform:skewX(-10deg);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);box-shadow:none}
.strip{background:linear-gradient(100deg,color-mix(in srgb,var(--brand) 18%,var(--surface)),var(--surface) 70%)!important;border-left:4px solid var(--brand)!important}
.cnt{background:var(--brand);color:var(--brand-ink);border-radius:2px}
/* side & top */
.side{background:#091221;border-right:1px solid var(--line)}
.brand{border-bottom:1px solid var(--line)}
.brand .ico,.lp-logo .ico{background:var(--brand);color:var(--brand-ink);border:0;box-shadow:none;border-radius:4px;transform:skewX(-8deg)}
.ngroup{color:var(--brand);font-style:italic;letter-spacing:.06em}
.nlink{color:var(--ink);border-radius:3px;border-left:3px solid transparent}
.nlink .ic{border:0;background:color-mix(in srgb,var(--k) 18%,transparent);color:var(--k);border-radius:3px}
.nlink:hover{background:var(--surface)}
.nlink[aria-current="page"]{background:linear-gradient(90deg,color-mix(in srgb,var(--brand) 16%,transparent),transparent);box-shadow:none;border-left-color:var(--brand)}
.nlink[aria-current="page"] .ic{background:var(--brand);color:var(--brand-ink);box-shadow:none}
.side-foot{border-top:1px solid var(--line)}
.topbar{background:#091221;border-bottom:1px solid var(--line);position:sticky}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;background:linear-gradient(90deg,var(--brand) 0 22%,var(--accent2) 22% 30%,transparent 30%)}
.tb-ico{background:var(--k);color:var(--on-color);border:0;box-shadow:none;border-radius:4px;transform:skewX(-10deg)}
.daychip{background:var(--brand);color:var(--brand-ink);border:0;box-shadow:none;border-radius:3px;transform:skewX(-10deg)}
.daychip.no{background:var(--surface2);color:var(--ink)}
.datechip{background:var(--surface2);border:1px solid var(--line);box-shadow:none;color:var(--ink);border-radius:3px}
.datechip svg{color:var(--brand)}
.saving{color:var(--brand)}
/* bottom bar */
.bnav{background:rgba(9,18,33,.97)!important;border:1px solid var(--line)!important;box-shadow:0 10px 30px rgba(0,0,0,.5)!important;border-radius:6px!important}
.bnav a,.bnav .bm{color:var(--muted)}
.bnav a[aria-current="page"]{color:var(--brand)!important;background:color-mix(in srgb,var(--brand) 12%,transparent)!important;box-shadow:inset 0 -3px 0 var(--brand)!important;border-radius:3px}
.bnav .bfab{color:var(--ink)}
.bnav .bfab .pl{background:var(--brand);border:0;box-shadow:none;border-radius:3px;transform:skewX(-10deg);color:var(--brand-ink)}
/* tiles */
.t-day{background:linear-gradient(120deg,#1a8f52,#21c46b)!important;color:#06140b}
.t-day.offday{background:linear-gradient(120deg,#1a2c48,#24395c)!important;color:var(--ink)}
.t-day.holday{background:linear-gradient(120deg,#c47a00,#ffb020)!important;color:#1b1100}
.t-day .bar{background:rgba(0,0,0,.25);border:0}.t-day .bar i{background:currentColor}
.t-next{background:linear-gradient(120deg,#ff5a00,#ff7a1a 55%,#ffb020)!important;color:#1b0b00}
.t-next::after{background:repeating-linear-gradient(-45deg,rgba(0,0,0,.18) 0 6px,transparent 6px 16px);opacity:1;border:0;border-radius:0;right:-40px;top:-40px;width:260px;height:260px;transform:skewX(-20deg)}
.t-next .btn,.t-day .btn{background:#0b1524;color:#fff;border-color:#0b1524}
.t-soft{background:color-mix(in srgb,var(--k) 12%,var(--surface))!important;border-left:4px solid var(--k)!important}
.big{color:var(--k)}
.t-label{color:inherit;opacity:.9;font-style:italic;letter-spacing:.06em}
/* calendar cells */
.dc{border:0;border-radius:3px;color:#06140b;font-weight:700;box-shadow:none;transform:skewX(-6deg)}
.dc.sat{color:var(--d-sat-ink)}.dc.off{color:#7f93b2}
.dc.sun,.dc.holiday,.dc.makeup{color:#0b1524}
.dc.today{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent2)}
.dc.mt::after{background:#0b1524;height:3px;width:16px}
.dc.sat.mt::after,.dc.off.mt::after{background:var(--brand)}
.dc .mk{background:#0b1524}
.mini .wd,.yg-h{color:var(--muted)}
.yg-c{border:0;border-radius:2px;color:#06140b}
.yg-c.sat{color:var(--d-sat-ink)}
.yg-c.off{background:var(--d-off);color:#5d7290}
.yg-c.sun{background:var(--d-sun);color:#0b1524}
.yg-c.today{outline:2px solid var(--accent2);outline-offset:1px}
.yg-c.mt::after{background:#0b1524}
.yg-c.sat.mt::after,.yg-c.off.mt::after{background:var(--brand)}
.yg-n .yg-m{border-bottom:1px solid var(--line)}
.yg-n .yg-mt{background:var(--d-school);color:#06140b;border:0;border-radius:2px;transform:skewX(-10deg)}
.yg-foot b{background:var(--brand);color:var(--brand-ink);border:0;border-radius:2px;transform:skewX(-10deg)}
.lgd-t{border-right:1px solid var(--line);color:var(--brand)}
.lgd-i .yg-c{transform:skewX(-6deg)}
.mband .mnum{background:var(--k);color:var(--on-color);border:0;box-shadow:none;border-radius:3px;transform:skewX(-10deg);font-style:italic}
.mband .stats span{border:1px solid var(--line);background:var(--surface2);border-radius:2px;transform:skewX(-10deg)}
.mblock.now .mband .stats span.cur{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.mband .rule{border-top:1px solid var(--line)}
/* tables, inputs */
table.t th,.ytbl thead th,.ytbl tfoot td{background:var(--surface2);color:var(--brand);font-style:italic}
table.t td{border-top:1px solid var(--line2)}
.field input,.field select,.field textarea,.inp,.meta input,.form input,.ag-dept{background:#0b1524;border:1px solid var(--line);color:var(--ink);border-radius:3px}
.field input:focus,.inp:focus,.meta input:focus{outline:2px solid var(--brand);outline-offset:0}
.ag-sum{background-color:#0d1a2e;border:1px solid var(--line)}
.ag-title,.title-in{color:var(--ink)}
.mhead{background:linear-gradient(110deg,color-mix(in srgb,var(--c-violet) 22%,var(--surface)),var(--surface) 70%);border-bottom:1px solid var(--line)}
.eyebrow{color:var(--brand)}
.ag-num{color:var(--accent2);font-style:italic}
.minebtn{border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:2px;transform:skewX(-10deg)}
.minebtn[aria-pressed="true"]{background:var(--c-amber);color:#1b0b00;border-color:var(--c-amber)}
.fchip{background:var(--surface2);border:1px solid var(--line);color:var(--ink);border-radius:3px}
.file{background:var(--surface2)}
.thumb{background:#0b1524}
.qbtn{border:0;box-shadow:none;border-radius:4px;color:var(--on-color);clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,0 100%)}
.modal{background:rgba(3,8,16,.7)}
.toast{background:var(--brand);color:var(--brand-ink);border:0;box-shadow:0 10px 30px rgba(0,0,0,.5);border-radius:3px;font-weight:600}
.appfoot{color:var(--muted)}
.appfoot .heart{background:var(--brand);color:var(--brand-ink);border:0;border-radius:2px;transform:skewX(-10deg);display:inline-block}
.hint{color:var(--muted)}
.tool,.swatch{border-color:var(--line)}
.tool{background:var(--surface2);color:var(--ink)}
.tool[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
/* landing */
.landing{background:repeating-linear-gradient(135deg,rgba(198,244,50,.04) 0 2px,transparent 2px 24px),radial-gradient(900px 600px at 80% 20%,rgba(47,180,255,.18),transparent 60%),radial-gradient(700px 500px at 0% 100%,rgba(255,122,26,.16),transparent 60%),#0b1524!important}
.lp-chip{background:var(--surface2);border:1px solid var(--line);box-shadow:none;color:var(--ink);border-radius:3px;transform:skewX(-10deg)}
.lp-kick{background:var(--accent2);color:#1b0b00;border:0;box-shadow:none;border-radius:2px;transform:skewX(-10deg)}
.lp-copy h1 .en{color:var(--brand);font-style:italic}
.lp-copy p{color:var(--muted)}
.lp-stat{border:0;border-left:4px solid var(--k);background:color-mix(in srgb,var(--k) 14%,var(--surface));box-shadow:none;border-radius:3px;color:var(--ink)}
.lp-stat b{color:var(--k);font-style:italic}
.lp-enter{background:var(--brand);color:var(--brand-ink);border:0;box-shadow:0 0 0 0 transparent;border-radius:3px;transform:skewX(-12deg);font-style:italic}
.lp-enter:hover{transform:skewX(-12deg) translateY(-2px);box-shadow:0 8px 24px rgba(198,244,50,.25)}
.lp-enter:active{transform:skewX(-12deg) translateY(1px)}
.lp-frame{background:var(--surface);border:1px solid var(--line);box-shadow:none;border-radius:4px;clip-path:polygon(0 0,calc(100% - 28px) 0,100% 28px,100% 100%,28px 100%,0 calc(100% - 28px))}
.lp-frame{border:2px solid var(--brand)!important}
.lp-sticker{border:0;box-shadow:none;border-radius:2px;transform:skewX(-10deg);color:var(--on-color);background:var(--k)}
.lp-foot b{color:var(--brand)}

/* home layout: fixed areas so no gaps at any width */
.bento{grid-template-areas:"day next next" "year year year" "up up mine"}
.t-day{grid-area:day}.t-next{grid-area:next}.t-year{grid-area:year}.t-up{grid-area:up}.t-mine{grid-area:mine}
.bento>.tile{order:0!important}
@media (max-width:860px){.sgrid>span:empty{display:none}}
@media (max-width:1100px){.bento{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-areas:"day mine" "next next" "year year" "up up"}}
@media (max-width:600px){.bento{grid-template-columns:minmax(0,1fr);grid-template-areas:"day" "next" "mine" "year" "up"}}
/* menu sheet: go to welcome page */
.mhome{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:6px;border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:4px;background:var(--surface2);text-decoration:none;color:var(--ink);font-weight:700;font-style:italic}
.mhome svg{width:22px;height:22px;color:var(--brand)}
.mhome small{display:block;font-weight:400;font-style:normal;color:var(--muted);font-size:12.5px}
.madd{margin-top:10px;background:none;font:inherit;cursor:pointer;width:100%;min-height:64px}
.madd:hover{border-color:var(--brand);color:var(--brand)}

.irow2 .badge,.irow .badge,table.t .badge,.hol-b .cat{width:128px;justify-content:center;text-align:center;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-flex}
@media (max-width:520px){.irow2 .badge,.irow .badge{width:104px;font-size:11.5px}}
@media (max-width:600px){.irow .badge{display:none!important}}
/* report */
.rp-wrap{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px}
.rp-opts{display:flex;flex-direction:column;gap:10px}
.rp-doc{background:#fff;color:#111;border-radius:4px;padding:28px 32px;font-family:'Sarabun','TH Sarabun New','IBM Plex Sans Thai',sans-serif;font-size:15px;line-height:1.75;max-height:62vh;overflow:auto}
.rp-doc h4{text-align:center;margin:0 0 2px;font-size:17px;font-style:normal;font-weight:700}
.rp-doc .c{text-align:center;margin:0}
.rp-doc .ag{font-weight:700;margin:14px 0 2px}
.rp-doc .ind{text-indent:2.5em;margin:0;white-space:pre-wrap}
.rp-doc .sig{margin-top:22px;text-align:right}
@media (max-width:760px){.rp-wrap{grid-template-columns:minmax(0,1fr)}.rp-doc{padding:18px;max-height:none}}
/* tasks */
.qhero{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center;padding:20px}

const toD=s=>{const p=pd(s);return new Date(p.y,p.m-1,p.d)};

const TERMS=()=>[{no:1,start:cfg.s1start,end:cfg.s1end},{no:2,start:cfg.s2start,end:cfg.s2end}].filter(t=>t.start&&t.end&&t.start<=t.end);
const termOf=ds=>TERMS().find(t=>t.start<=ds&&ds<=t.end)||null;
let evIdx=new Map(),infoMemo=new Map(),seqMap=new Map(),termTotals={};
function rebuild(){
  evIdx=new Map();infoMemo=new Map();seqMap=new Map();termTotals={};
  for(const e of events){let s=e.date,end=e.end&&e.end>=e.date?e.end:e.date,g=0;while(s<=end&&g<400){if(!evIdx.has(s))evIdx.set(s,[]);evIdx.get(s).push(e);s=addDays(s,1);g++}}
  const ts=TERMS();if(!ts.length)return;
  let s=ts[0].start,end=ts[ts.length-1].end,n=0,g=0;
  while(s<=end&&g<800){const inf=info(s);if(inf.school){n++;seqMap.set(s,n);termTotals[inf.term.no]=(termTotals[inf.term.no]||0)+1}s=addDays(s,1);g++}
}
function info(ds){
  if(infoMemo.has(ds))return infoMemo.get(ds);
  const p=pd(ds),t=termOf(ds),ev=evIdx.get(ds)||[];
  const hol=ev.find(e=>e.cat==='holiday'||e.cat==='special'),mk=ev.find(e=>e.cat==='makeup');
  let type;if(!t)type='off';else if(mk)type='makeup';else if(hol)type='holiday';else if(p.dow===0)type='sun';else if(p.dow===6)type='sat';else type='school';
  const r={type,school:type==='school'||type==='makeup',term:t,hol,mk};infoMemo.set(ds,r);return r;
}
function monthStats(y,m){const dim=new Date(y,m,0).getDate();let n=0,term=null;
  for(let d=1;d<=dim;d++){const ds=iso(y,m,d),inf=info(ds);if(inf.school){n++;term=term||inf.term}}
  if(!term)term=termOf(iso(y,m,1))||termOf(iso(y,m,dim));
  let cum=0;if(term){const last=iso(y,m,dim)<term.end?iso(y,m,dim):term.end;for(const [k,v] of seqMap)if(k>=term.start&&k<=last)cum++}
  return {n,term,cum}}
function monthsBetween(a,b){const out=[];let y=pd(a).y,m=pd(a).m;const pb=pd(b);let g=0;while((y<pb.y||(y===pb.y&&m<=pb.m))&&g<30){out.push([y,m]);m++;if(m>12){m=1;y++}g++}return out}

const curTermNo=()=>{const t=termOf(todayISO);if(t)return t.no;const nx=TERMS().find(t=>t.start>todayISO);return nx?nx.no:2};
const weekOf=(ds,term)=>Math.floor(diffDays(addDays(term.start,-pd(term.start).dow),ds)/7)+1;

function itemsInRange(a,b){

  plans.filter(p=>overlaps(p,a,b)).forEach(p=>{const d=DEPTS[p.dept]||DEPTS.personal;out.push({kind:'p',id:p.id,date:p.date<a?a:p.date,k:d[1],title:p.text,tag:DEPT_SHORT[p.dept]||'ส่วนตัว',sub:rangeTxt(p.date,p.end,p.time)+(p.note?' · '+p.note:''),t:p.time||''})});

function planItemsFor(dept,a,b){
  const items=plans.filter(p=>p.dept===dept&&overlaps(p,a,b)).map(p=>({kind:'p',id:p.id,date:p.date,html:`<b>${esc(rangeTxt(p.date,p.end,p.time))}</b> ${esc(p.text)}`}));
  meetings.filter(m=>m.date>=a&&m.date<=b).forEach(m=>{
    if(dept==='personal')items.push({kind:'m',id:m.id,date:m.date,ag:true,html:`<b>${esc(rangeTxt(m.date,'',m.time))}</b> ${esc(m.title||'การประชุม')}`});
    (m.agendas||[]).forEach(ag=>{if(ag.dept===dept)items.push({kind:'m',id:m.id,date:m.date,ag:true,html:`<b>${sDate(m.date)}</b> วาระประชุม: ${esc(ag.title||'(ไม่มีชื่อ)')}`})})});
  return items.sort((x,y)=>x.date.localeCompare(y.date));
}
function pCal(y,m,term){const first=new Date(y,m-1,1).getDay(),dim=new Date(y,m,0).getDate();const rows=Math.ceil((first+dim)/7);let h='';

      const ds=iso(y,m,d),inf=info(ds);if(term&&!wk&&ds>=addDays(term.start,-pd(term.start).dow)&&ds<=term.end)wk=weekOf(ds,term);
      const mt=meetings.some(x=>x.date===ds);tds+=`<td><button type="button" class="${inf.type}${ds===todayISO?' today':''}${mt?' mt':''}" data-day="${ds}" aria-label="${thDate(ds)}${mt?' มีการประชุม':''}">${d}</button></td>`}
    h+=`<tr>${tds}<td>${wk||''}</td></tr>`}
  return `<table class="pc"><thead><tr>${TH_DS.map(x=>`<th>${x}</th>`).join('')}<th>สัปดาห์ที่</th></tr></thead><tbody>${h}</tbody></table>`}

const FONT_R='fonts/THSarabunPSK.ttf',FONT_B='fonts/THSarabunPSK-Bold.ttf';
const thDigits=t=>String(t).replace(/[0-9]/g,d=>'๐๑๒๓๔๕๖๗๘๙'[d]);

/* block types: title, h, c, p, i (indented), li, s (right), sp, rule */
function normBlocks(B,thai){const f=thai?thDigits:(x=>x);const out=[];B.forEach(b=>{if(b.t==='sp'||b.t==='rule'){out.push(b);return}String(b.x??'').split('\n').forEach((ln,k)=>out.push({...b,x:f(ln),cont:k>0}))});return out}
function blocksHTML(B){return B.map(b=>b.t==='title'?`<h4>${esc(b.x)}</h4>`:b.t==='h'?`<p class="ag">${esc(b.x)}</p>`:b.t==='c'?`<p class="c">${esc(b.x)}</p>`:b.t==='i'?`<p class="ind">${esc(b.x)}</p>`:b.t==='li'?`<p class="li">• ${esc(b.x)}</p>`:b.t==='s'?`<p class="sig">${esc(b.x)}</p>`:b.t==='sp'?'<p>&nbsp;</p>':b.t==='rule'?'<p class="c">-------------------------------</p>':`<p>${esc(b.x)}</p>`).join('')}
function blocksText(B){return B.map(b=>b.t==='i'?'        '+b.x:b.t==='li'?'• '+b.x:b.t==='h'?'\n'+b.x:b.t==='sp'?'':b.t==='rule'?'-------------------------------':b.x).join('\n')}
const u8=a=>new Uint8Array(a);
function obfuscate(buf,guid){const key=[];const hx=guid.replace(/[{}-]/g,'');for(let k=0;k<16;k++)key.push(parseInt(hx.substr(k*2,2),16));key.reverse();const d=new Uint8Array(buf.slice(0));for(let k=0;k<32;k++)d[k]^=key[k%16];return d}
const newGuid=()=>'{'+'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return (c==='x'?r:(r&3|8)).toString(16).toUpperCase()})+'}';
async function buildDocx(B){
  if(!window.JSZip)throw {code:'unavailable'};

  const para=(t,{al,b,ind,hang,sz,before}={})=>`<w:p><w:pPr>${al?`<w:jc w:val="${al}"/>`:''}${ind?'<w:ind w:firstLine="1418"/>':''}${hang?'<w:ind w:left="567" w:hanging="283"/>':''}<w:spacing w:before="${before||0}" w:after="0" w:line="240" w:lineRule="auto"/></w:pPr>${t===''?'':run(t,b,sz)}</w:p>`;
  let body='';
  B.forEach(b=>{switch(b.t){case 'title':body+=para(b.x,{al:'center',b:1,sz:36});break;case 'h':body+=para(b.x,{b:1,before:b.cont?0:160});break;case 'c':body+=para(b.x,{al:'center'});break;
    case 'i':body+=para(b.x,{ind:1});break;case 'li':body+=para('• '+b.x,{hang:1});break;case 's':body+=para(b.x,{al:'right'});break;case 'sp':body+=para('');break;
    case 'rule':body+=para('-------------------------------',{al:'center'});break;default:body+=para(b.x)}});
  const [fr,fb]=await Promise.all([fetch(FONT_R).then(r=>r.arrayBuffer()),fetch(FONT_B).then(r=>r.arrayBuffer())]);
  const g1=newGuid(),g2=newGuid();
  const W='xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"';
  const z=new JSZip();

function segWords(t){try{if(Intl.Segmenter){return [...new Intl.Segmenter('th',{granularity:'word'}).segment(t)].map(x=>x.segment)}}catch(_){}return t.split(/(\s+)/)}
async function buildPdf(B){
  if(!window.PDFLib)throw {code:'unavailable'};
  await loadDocFonts();
  const PT=595.28,PH=841.89,S=2.6,ML=85.05,MR=56.7,MT=70.9,MB=56.7,CW=PT-ML-MR;
  const pages=[];let cv,ctx,y;
  const newPage=()=>{cv=document.createElement('canvas');cv.width=Math.round(PT*S);cv.height=Math.round(PH*S);ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);ctx.fillStyle='#000';ctx.scale(S,S);ctx.textBaseline='alphabetic';pages.push(cv);y=MT};
  newPage();
  const setF=(sz,b)=>{ctx.font=`${b?700:400} ${sz}px THSarabunDoc`};
  const wrap=(t,w)=>{const words=segWords(t);const lines=[];let cur='';for(const wd of words){const tryS=cur+wd;if(ctx.measureText(tryS).width<=w||!cur){if(ctx.measureText(wd).width>w&&!cur){let part='';for(const ch of [...wd]){if(ctx.measureText(part+ch).width>w&&part){lines.push(part);part=ch}else part+=ch}cur=part}else cur=tryS}else{lines.push(cur.trimEnd());cur=wd.trimStart()}}if(cur)lines.push(cur);return lines.length?lines:['']};
  for(const b of B){
    const sz=b.t==='title'?18:16,bold=b.t==='title'||b.t==='h',lh=sz*1.18;
    if(b.t==='h'&&!b.cont)y+=8;
    setF(sz,bold);
    const txt=b.t==='rule'?'-------------------------------':b.t==='sp'?'':b.t==='li'?b.x:b.x;
    const ind=b.t==='i'?40.2:b.t==='li'?16:0;
    const lines=b.t==='sp'?['']:wrap(txt,CW-ind-(b.t==='li'?0:0));
    lines.forEach((ln,k)=>{if(y+lh>PH-MB){newPage();setF(sz,bold)}
      const base=y+sz*0.86;let xx=ML;const w=ctx.measureText(ln).width;
      if(b.t==='title'||b.t==='c'||b.t==='rule')xx=ML+(CW-w)/2;else if(b.t==='s')xx=ML+CW-w;else if(b.t==='i')xx=ML+(k===0?ind:0);else if(b.t==='li'){if(k===0)ctx.fillText('•',ML+4,base);xx=ML+ind}
      ctx.fillText(ln,xx,base);y+=lh});
  }
  const pdf=await PDFLib.PDFDocument.create();
  for(const c of pages){const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.9));const img=await pdf.embedJpg(await blob.arrayBuffer());const pg=pdf.addPage([PT,PH]);pg.drawImage(img,{x:0,y:0,width:PT,height:PH})}
  pdf.setTitle(B[0]&&B[0].x||'เอกสาร');pdf.setCreator(cfg.systemName);
  return new Blob([await pdf.save()],{type:'application/pdf'});
}
async function saveDoc(kind,B,name){
  if(kind==='pdf')return previewPdf(B,name);
  if(!dl){toast('หน้านี้ดาวน์โหลดไฟล์ไม่ได้ ใช้ปุ่มคัดลอกข้อความแทน');return}
  busy(1);try{const blob=await buildDocx(B);await dl.save({filename:`${name}.docx`,data:blob});toast('บันทึกไฟล์แล้ว')}
  catch(e){if(e&&e.code==='declined')return;toast(e&&e.code==='rate_limited'?'มีหน้าต่างบันทึกเปิดอยู่แล้ว':'สร้างไฟล์ไม่สำเร็จ ลองใหม่อีกครั้ง')}finally{busy(-1)}
}
async function previewPdf(B,name){
  const back=modalKind==='report'?$('#dlg').innerHTML:null;const backKind=modalKind;
  openModal(`<div class="dlg-h"><h3>ตัวอย่างไฟล์ PDF</h3><span class="hint" id="pvInfo">กำลังสร้างไฟล์…</span></div>
   <div class="dlg-b pdfpv" id="pvBody"><p class="hint" style="text-align:center;padding:40px 0">กำลังสร้างตัวอย่าง PDF…</p></div>
   <div class="pv-foot"><button class="btn" type="button" id="pvBack">${I.left} กลับไปแก้ไข</button><button class="btn primary" type="button" id="pvSave" disabled>${I.doc} ดาวน์โหลด PDF</button></div>`,'pdfpreview',true);
  let blob=null;
  $('#pvBack').onclick=()=>{closeModal();if(back&&backKind==='report'){const m=curM();if(m)openReport(m.id)}};
  $('#pvSave').onclick=async()=>{if(!blob)return;if(!dl){toast('อุปกรณ์นี้ดาวน์โหลดไฟล์จากหน้านี้ไม่ได้');return}
    try{await dl.save({filename:`${name}.pdf`,data:blob});toast('บันทึกไฟล์แล้ว')}catch(e){if(e&&e.code==='declined')return;toast(e&&e.code==='rate_limited'?'มีหน้าต่างบันทึกเปิดอยู่แล้ว':'ดาวน์โหลดไม่สำเร็จ ลองใหม่อีกครั้ง')}};
  try{
    blob=await buildPdf(B);
    const host=$('#pvBody');if(!host)return;host.innerHTML='';
    if(!window.pdfjsLib)throw 0;
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf=await pdfjsLib.getDocument({data:new Uint8Array(await blob.arrayBuffer())}).promise;
    $('#pvInfo').textContent=`${pdf.numPages} หน้า · A4 · ${(blob.size/1024).toFixed(0)} KB`;
    for(let n=1;n<=pdf.numPages;n++){if(!host.isConnected)return;const pg=await pdf.getPage(n);const v1=pg.getViewport({scale:1});
      const w=Math.min(host.clientWidth-8,820);const sc=w/v1.width*(window.devicePixelRatio||1);const vp=pg.getViewport({scale:sc});
      const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;c.className='pv-page';c.style.width=w+'px';
      const lab=document.createElement('div');lab.className='pv-num';lab.textContent=`หน้า ${n} / ${pdf.numPages}`;
      host.appendChild(lab);host.appendChild(c);await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise}
    $('#pvSave').disabled=false;
  }catch(e){if($('#pvInfo'))$('#pvInfo').textContent=blob?`A4 · ${(blob.size/1024).toFixed(0)} KB`:'';const host=$('#pvBody');if(host)host.innerHTML='<p class="hint" style="text-align:center;padding:30px 0">แสดงตัวอย่างไม่ได้ แต่ยังดาวน์โหลดไฟล์ได้ตามปกติ</p>';if(blob&&$('#pvSave'))$('#pvSave').disabled=false;else toast('สร้างไฟล์ไม่สำเร็จ ลองใหม่อีกครั้ง')}
}

function reportBlocks(m,o){
  const ag=m.agendas||[];const B=[];
  B.push({t:'title',x:'รายงานการประชุม'});B.push({t:'title',x:m.title||'การประชุม'});
  if(o.no)B.push({t:'c',x:'ครั้งที่ '+o.no});
  B.push({t:'c',x:`${thDate(m.date)}${m.time?' เวลา '+m.time.replace(':','.')+' น.':''}`});
  if(m.place)B.push({t:'c',x:'ณ '+m.place});
  B.push({t:'rule'});
  if(o.att)B.push({t:'p',x:'ผู้มาประชุม '+o.att+' คน'});
  B.push({t:'p',x:`เริ่มประชุมเวลา ${m.time?m.time.replace(':','.'):'.........'} น.`});
  ag.forEach((a,i)=>{B.push({t:'h',x:`ระเบียบวาระที่ ${thn(i+1)} ${a.title||''}`});
    B.push({t:'i',x:(a.summary||'').trim()||'-'});
    if(a.ink)B.push({t:'i',x:'(มีบันทึกลายมือประกอบในระบบ)'});
    if((a.files||[]).length)B.push({t:'i',x:'เอกสารประกอบ: '+a.files.map(f=>f.name).join(', ')})});
  if(!ag.length)B.push({t:'p',x:'(ยังไม่มีระเบียบวาระ)'});
  B.push({t:'sp'});B.push({t:'p',x:`เลิกประชุมเวลา ${o.end?o.end.replace(':','.'):'.........'} น.`});
  B.push({t:'sp'});B.push({t:'s',x:'(ลงชื่อ).......................................... ผู้จดรายงานการประชุม'});
  B.push({t:'s',x:`( ${o.writer||'..........................................'} )`});
  return normBlocks(B,o.thai);
}

  const persist=()=>{const r=read();Object.assign(m,{reportNo:r.no,reportAtt:r.att,reportEnd:r.end,reportWriter:r.writer});scheduleSave(m.id,['reportNo','reportAtt','reportEnd','reportWriter'],0)};
  const fname=()=>{const p=pd(m.date);return `รายงานการประชุม_${p.d}-${p.m}-${p.y+543}`};
  $('#rp-copy').onclick=async()=>{persist();const t=blocksText(reportBlocks(m,read()));try{await navigator.clipboard.writeText(t);toast('คัดลอกรายงานแล้ว')}catch(_){const r=document.createRange();r.selectNodeContents($('#rpDoc'));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);toast('เลือกข้อความไว้แล้ว กดคัดลอกได้เลย')}};
  $('#rp-docx').onclick=()=>{persist();saveDoc('docx',reportBlocks(m,read()),fname())};

const weekStart=ds=>{const p=pd(ds);return addDays(ds,-((p.dow+6)%7))};
const XP_PER=10,XP_LVL=100;
const RANKS=[[0,'เริ่มภารกิจ'],[25,'วอร์มอัพ'],[50,'ทำคอมโบ'],[75,'ใกล้เคลียร์'],[100,'เคลียร์ภารกิจ!']];

/* ================= uploads ================= */
async function prepImage(file){try{const bmp=await createImageBitmap(file);const s=Math.min(1,2400/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.86));return b||file}catch(_){return file}}
async function uploadFiles(list,mid,aid){if(!assets||!mid)return;
  for(const f of list){const isPdf=f.type==='application/pdf'||/\.pdf$/i.test(f.name);const isImg=f.type.startsWith('image/')||/\.(jpe?g|png|webp|gif|heic|heif)$/i.test(f.name);
    if(!isPdf&&!isImg){toast(`${f.name}: รองรับเฉพาะรูปภาพและ PDF (ไฟล์ Word ให้บันทึกเป็น PDF ก่อน)`);continue}
    busy(1);try{const blob=isPdf?f:await prepImage(f);const type=isPdf?'application/pdf':(['image/jpeg','image/png','image/webp','image/gif'].includes(blob.type)?blob.type:'image/jpeg');
      const r=await assets.upload(blob,{type});const m=getM(mid);if(!m)continue;const rec={id:r.id,name:f.name||'รูปถ่าย',kind:isPdf?'pdf':'image'};
      if(aid){const a=(m.agendas||[]).find(x=>x.id===aid);if(!a)continue;a.files=[...(a.files||[]),rec];scheduleSave(mid,['agendas'],0)}else{m.files=[...(m.files||[]),rec];scheduleSave(mid,['files'],0)}
      await flush(mid);renderView()}catch(e){toast(`${f.name}: ${errMsg(e)}`)}finally{busy(-1)}}}

  db.collection('tasks').onSnapshot(snap=>{tasks=snap.docs.map(d=>({id:d.id,...clone(d.data())}));if(route==='landing')renderLanding();else if(status==='ready'&&(route==='tasks'||route==='home'))renderView()},()=>{});
  const got={m:false,e:false,p:false,c:false};
  const tick=k=>{got[k]=true;if(status==='loading'&&got.m&&got.e&&got.p&&got.c){status='ready';
      if(!meetId&&!inMonth(mview.year,mview.month).length){const up=meetings.map(m=>m.date).filter(d=>d>=todayISO).sort()[0]||meetings.map(m=>m.date).sort().pop();if(up){const p=pd(up);mview={year:p.y,month:p.m}}}}
    if(status==='ready'){if(meetId){const m=getM(meetId);if(m){const p=pd(m.date);mview={year:p.y,month:p.m}}}render()}};
  db.doc('settings/config').onSnapshot(s=>{const d=s.exists?s.data():null;cfgSaved=!!d;cfg={...DEF_CFG,...(d?clone(d):{})};rebuild();tick('c')},()=>tick('c'));
  db.collection('events').onSnapshot(snap=>{events=snap.docs.map(d=>({id:d.id,...clone(d.data())})).filter(e=>HT[e.cat]&&e.date);rebuild();tick('e')},()=>tick('e'));
  db.collection('plans').onSnapshot(snap=>{plans=snap.docs.map(d=>({id:d.id,...clone(d.data())})).filter(p=>p.date);tick('p')},()=>tick('p'));
  db.collection('meetings').onSnapshot(snap=>{const old=new Map(meetings.map(m=>[m.id,m]));meetings=snap.docs.map(d=>{const id=d.id;if(dirty.has(id)&&old.has(id))return old.get(id);return {id,...clone(d.data())}});tick('m')},()=>{toast('เชื่อมต่อข้อมูลไม่สำเร็จ ลองเปิดหน้านี้ใหม่');tick('m')});
})();
})();
</script>
